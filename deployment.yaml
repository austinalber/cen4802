apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
  labels:
    app: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app-container
        # Replace the line below with your exact image name and tag
        image: cen4802-midterm:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: APP_LOG_LEVEL
          value: "INFO"